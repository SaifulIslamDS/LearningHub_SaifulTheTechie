name: External link check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links in learning sources
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429
            --exclude 'example\.com' --exclude '^file://' --exclude 'localhost'
            'content/**/*.md' 'content/glossary.yml' 'README.md'
          output: lychee/out.md
          fail: false
      - name: Open or update broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links --color B5534A --description "External links that failed the weekly check" 2>/dev/null || true
          number=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file lychee/out.md
          else
            gh issue create --title "Broken external links ($(date +%F))" --label broken-links --body-file lychee/out.md
          fi

[project]
name = "csv-cleaner"
version = "1.0.0"
description = "Clean messy CSV exports with repeatable, configurable rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
csv-clean = "csv_cleaner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<1.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

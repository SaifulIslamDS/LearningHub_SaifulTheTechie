version: 2

models:
  - name: fct_orders
    description: "BI-ready order fact table at one row per order."
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: net_revenue
        data_tests: [not_null]
  - name: dim_customers
    description: "Current customer dimension used by the Phase 3 analytical marts."
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: mart_monthly_revenue
    description: '{{ doc("mart_monthly_revenue") }}'
    columns:
      - name: order_month
        description: "First day of the reporting month."
        data_tests: [not_null, unique]
      - name: net_revenue
        description: "Revenue from all non-cancelled orders in the month."
        data_tests: [not_null]

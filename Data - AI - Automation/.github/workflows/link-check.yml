# Weekly check of external links in lessons (free resources can move or disappear).
# Broken links are listed in the run summary AND in one GitHub issue labelled "broken-links",
# which is created on the first failure and updated with a comment on later failures.
name: External link check

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # lesson sources, project briefs and the glossary; skip example domains and local files
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429
            --exclude 'example\.com' --exclude '^file://' --exclude 'localhost'
            'content/**/*.md' 'content/glossary.yml' 'README.md'
          output: lychee/out.md
          fail: false

      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links --color B5534A --description "External links that failed the weekly check" 2>/dev/null || true
          number=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file lychee/out.md
          else
            gh issue create --title "Broken external links ($(date +%F))" --label broken-links --body-file lychee/out.md
          fi
